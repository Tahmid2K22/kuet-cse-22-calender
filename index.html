<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/kuet-cse-22-calender/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KUET CSE 22 academic calendar backed by Google Sheets.">
  <meta name="theme-color" content="#146B45">

  <!-- Keep the site unlisted and avoid leaking the app URL to third parties. -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">

  <!--
    GitHub Pages cannot send security headers, so the policy lives here.
    script-src allows the inline splash handler, Flutter's WebAssembly engine
    and the Google Apps Script JSONP endpoint. Nothing else may execute.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' blob: https://script.google.com https://script.googleusercontent.com https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KUET CSE 22 Calender">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KUET CSE 22 Calender</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F6FBF8;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #F6FBF8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      z-index: 9999;
      transition: opacity 180ms ease-out;
    }

    #splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-mark {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #146B45;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px rgba(20, 107, 69, 0.24);
    }

    .splash-mark svg {
      width: 34px;
      height: 34px;
      display: block;
    }

    .splash-title {
      color: #15251C;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .splash-subtitle {
      color: #64786B;
      font-size: 12px;
      margin-top: -10px;
    }

    .splash-spinner {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2.5px solid rgba(20, 107, 69, 0.16);
      border-top-color: #146B45;
      animation: splash-spin 800ms linear infinite;
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-spinner { animation-duration: 2s; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="splash-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="5" width="18" height="16" rx="3" stroke="#FFFFFF" stroke-width="1.8"/>
        <path d="M3 10H21" stroke="#FFFFFF" stroke-width="1.8"/>
        <path d="M8 3V7" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M16 3V7" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
        <rect x="7" y="13" width="3.5" height="3.5" rx="1" fill="#FFFFFF"/>
      </svg>
    </div>
    <div class="splash-title">KUET CSE 22 Calender</div>
    <div class="splash-subtitle">Loading events…</div>
    <div class="splash-spinner" aria-hidden="true"></div>
  </div>

  <noscript>
    <style>
      #splash { display: none; }
    </style>
    <p style="font-family: sans-serif; padding: 24px; color: #15251C;">
      KUET CSE 22 Calender needs JavaScript enabled to run.
    </p>
  </noscript>

  <script>
    // Remove the HTML splash as soon as Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('is-hidden');
      window.setTimeout(function () {
        if (splash.parentNode) splash.parentNode.removeChild(splash);
      }, 220);
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
